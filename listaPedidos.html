<script>
  function preencheTabelaPedidos() {
    var table = $("table");
    table.empty();

    table.append("<tr>" +
      "<th style='min-width:200px;'>Nome Cliente</th>" +
      "<th style='min-width:300px;'>Descrição Pedido</th>" +
      "<th style='min-width:150px;'>Telefone</th>" +
      "<th>Instagram</th>" +
      "<th>Endereço</th>" +
      "<th>Prioritário</th>" +
      "<th>Data de Entrega Estimada</th>" +
      "<th>Data de Produção Estimada</th>" +
      "<th>Excluir</th>" +
      "<th>Informar Pagamento</th>" +
      "</tr>");

    let data = JSON.stringify({
      key: "listarPedido"
    });

    $.ajax({
      type: 'POST',
      url: '/site pam/api.php/Operacoes',
      data: data,
      success: function (resultado, teste, teste2) {

        let objetos = JSON.parse(resultado);
        let auxiliar = objetos.length;

            while (auxiliar != 0) {
              table.append("<tr>" +
                "<td>" + objetos[auxiliar - 1].nome + "</td>" +
                "<td>" + objetos[auxiliar - 1].descricaoPedido + "</td>" +
                "<td>" + objetos[auxiliar - 1].celular + "</td>" +
                "<td>" + objetos[auxiliar - 1].instagram + "</td>" +
                "<td>" + objetos[auxiliar - 1].endereco + "</td>" +
                "<td>" + objetos[auxiliar - 1].prioritario + "</td>" +
                "<td>" + objetos[auxiliar - 1].dataEntregaEstimada + "</td>" +
                "<td>" + objetos[auxiliar - 1].dataProducaoEstimada + "</td>" +
                "<td>"
                +"<button type='button' class='btn btn-danger'"+
                " onclick='Excluir(" + objetos[auxiliar - 1].Id +")'>"
                +"Excluir"+
                "</button></td>" +
                "<td>"
                  +"<button type='button' class='btn btn-success'"+
                  " onclick='Excluir(" + objetos[auxiliar - 1].Id +")'>"
                  +"Pagar"+
                  "</button></td>" +
                "</tr>");
              auxiliar--;
            }
      },
      error: function (jqXHR, textStatus, errorThrown) {
        debugger
      }
    });

  }

  $(document).ready(function () {
    preencheTabelaPedidos();
  });

  function cadastrarPedidos() {

    let prioritario = 0;

    if ($("#Prioritario").is(':checked')) {
      prioritario = 1;
    }

    let data = JSON.stringify({
      key: "cadastrarPedido",
      nome: $("#primeiroNome").val(), descricao: $("#exampleFormControlTextarea1").val(), instagram: $("#nickname").val(), email: $("#email").val(),
      celular: $("#celular").val(), endereco: $("#endereco").val(), enderecoSecundario: $("#endereco2").val(), pais: $("#pais").val(), estado: $("#estado").val(),
      cep: $("#cep").val(), dataEntregaEstimada: $("#cc-expiracao").val(),
      dataProducaoEstimada: $("#cc-expiracao-producao").val(), prioritario: prioritario
    });

    $.ajax({
      type: 'POST',
      url: '/site pam/api.php/Operacoes',
      data: data,
      success: function (resultado, teste, teste2, teste3) {
        debugger
        alert('data: ' + resultado);
      },
      error: function (jqXHR, textStatus, errorThrown) {
        debugger
      },
      // contentType: "application/json",
      //dataType: 'json'
    });
  }

  $('#Prioritario').change(function () {
    if (this.checked) {
      console.log('checked')
      $('#estimativa').show();
    }
    if (!this.checked) {
      console.log('checkedN')

      $('#estimativa').hide();
    }
  });
</script>
